[project]
name = "thoth"
version = "0.1.0"
description = "Áudio → partitura e tablatura, com foco em contrabaixo elétrico"
readme = "README.md"
authors = [
    { name = "Welington Carlos", email = "wcarlos3@gmail.com" }
]
# Teto em 3.13: o MuScriptor exige Python 3.10–3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "librosa>=1.0.0",
    "music21>=10.5.0",
    "numpy>=2.5.3",
    "pretty-midi>=0.2.11.post0",
    "pyguitarpro>=0.11",
    "typer>=0.15",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
thoth = "thoth.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6.122",
    "ruff>=0.9",
    "mypy>=1.14",
    "mir-eval>=0.8.2",
    "pretty-midi>=0.2.11.post0",
    "httpx>=0.28.1",
    "websockets>=17.1",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Testes que carregam modelo ou tocam a rede ficam FORA da suíte padrão.
addopts = "-m 'not slow and not network and not navegador'"
markers = [
    "slow: exercita modelo/ferramenta real (MuScriptor, Demucs, ffmpeg) — minutos em CPU",
    "network: depende de rede real",
    "navegador: abre um Chromium de verdade e inspeciona a página renderizada",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
# Bibliotecas de áudio/MIR sem stubs nem py.typed. O override nomeia o módulo
# IMPORTADO — nomear quem importa não tem efeito.
[[tool.mypy.overrides]]
module = ["pretty_midi.*", "mir_eval.*", "guitarpro.*", "soundfile.*"]
ignore_missing_imports = true

# O music21 tem `py.typed`, mas seus construtores não são anotados. Exigir
# chamada tipada aqui obrigaria a encher o adapter de `cast`, o que esconderia
# erro real em vez de encontrar algum.
[[tool.mypy.overrides]]
module = ["thoth.adapters.export.musicxml"]
disallow_untyped_calls = false

[tool.ruff.lint.flake8-bugbear]
# Typer expressa a CLI por defaults; não é o bug que o B008 procura.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
